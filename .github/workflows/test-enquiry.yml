name: Test PaTH enquiry delivery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-enquiry.yml"

permissions:
  contents: read

jobs:
  test-enquiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send test enquiry through production site
        run: |
          curl --fail-with-body --silent --show-error             --request POST             --url 'https://www.pathai.name.ng/api/enquiry'             --header 'Accept: application/json'             --header 'Content-Type: application/json'             --data '{"projectType":"Website","name":"PaTH Sender Test","email":"adewalemchel@gmail.com","company":"PaTH Digital Studio","message":"This is a live Resend sender test from the PaTH Digital Studio website. If this arrives, the configured sender is working."}'
