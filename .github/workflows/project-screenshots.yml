name: Refresh project screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/data/projects.json"
      - "scripts/capture-projects.mjs"
      - ".github/workflows/project-screenshots.yml"
  schedule:
    # Product marketing pages change often; refresh portfolio previews daily.
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: project-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture project homepages
        run: node scripts/capture-projects.mjs

      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects
          if git diff --cached --quiet; then
            echo "No screenshot changes."
            exit 0
          fi
          git commit -m "chore: refresh project homepage screenshots"
          git pull --rebase origin main
          git push origin HEAD:main
